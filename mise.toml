[tools]
bun = "1.4.2"

[tasks.verify]
description = "Check formatting, documentation, agent harnesses, types, and tests"
run = "bun run verify"

[tasks.format]
description = "Format TypeScript, JSON, and CI configuration"
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without modifying files"
run = "bun run format:check"

[tasks.test]
description = "Run all runtime tests"
run = "bun run test"

[tasks."test:unit"]
description = "Run unit tests"
run = "bun run test:unit"

[tasks."test:integration"]
description = "Check consumption of the packaged library"
run = "bun run test:integration"

[tasks.typecheck]
description = "Check source, tests, scripts, and type contracts"
run = "bun run typecheck"
